[pytest]
pythonpath = .
testpaths = tests
markers =
    glm52: GLM-5.2 cache-hit and billing correctness tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
addopts = -s -ra
# Note: --alluredir and --clean-alluredir are injected dynamically by run.py
# (timestamped per-run dir under reports/<YYYYMMDD-HHMMSS>/allure-results) so
# each run's results are kept separately instead of being overwritten. If you
# run pytest directly without run.py, pass --alluredir=<dir> yourself or no
# allure results will be collected.
